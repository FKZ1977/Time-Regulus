<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【重要】Time Regulus 更新のお知らせ</title>

  <!-- ========================================================= -->
  <!-- 1. アイコン・ファビコン設定（全OS公式規格準拠） -->
  <!-- 高解像度 apple-touch-icon を最優先配置し、Safariでの白枠縮小化を防止 -->
  <!-- ※ PWAスタンドアロン化（Safari枠の消失）を防ぐため、apple-mobile-web-app-capable および manifest は未指定にしています -->
  <!-- ========================================================= -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
  <meta name="apple-mobile-web-app-title" content="Time Regulus">
  <meta name="theme-color" content="#141414">

  <!-- ========================================================= -->
  <!-- 2. Windows 10/11 / Edge タイル設定 -->
  <!-- ========================================================= -->
  <meta name="msapplication-TileColor" content="#141414">
  <meta name="msapplication-TileImage" content="./mstile-150x150.png">
  <meta name="msapplication-config" content="./browserconfig.xml">

  <!-- ========================================================= -->
  <!-- 3. Mac Retina / 各種ブラウザ用 高解像度ファビコン (降順配置) -->
  <!-- ========================================================= -->
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="shortcut icon" href="./favicon.ico">

  <!-- ========================================================= -->
  <!-- 4. SNS / 共有メニュー用 OGPサムネイル設定 (Safari共有シート対策) -->
  <!-- ========================================================= -->
  <meta property="og:title" content="Time Regulus">
  <meta property="og:description" content="Time Regulus 公式Webアプリケーション">
  <meta property="og:image" content="./icon-512.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="./icon-512.png">
 
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R7PW7DY4GF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-R7PW7DY4GF');
</script>
  <style>
    /* 元のアプリのスタイル変数の一部を再利用して見た目を統一 */
    :root {
      --bg-dark: #0e0f11;
      --accent: #00ffe0; /* 水色/メインカラー */
      --text-main: #e0e0e0;
      --text-sub: #999;
      --pink-highlight: #ff69b4; /* ピンク色 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      text-align: center;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 600px;
      margin-top: 50px;
      padding: 20px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background-color: #151c27;
      box-shadow: 0 0 20px rgba(0, 255, 224, 0.3);
    }
    .fkz {
        font-family: 'serif'; 
        color: var(--accent);
        text-shadow: 0 0 15px rgba(0, 255, 224, 0.7);
        margin-bottom: 0;
        font-size: 38px;
        opacity: 0; 
        animation: fadeIn 2s forwards; 
    }
    .subtitle {
        color: var(--text-sub);
        margin-top: 4px;
        margin-bottom: 20px;
        font-size: 16px; 
        opacity: 0; 
        animation: fadeIn 2s forwards 0.5s; 
    }
    h2 {
      color: var(--accent);
      display: inline-block;
      padding-bottom: 5px;
      margin-top: 30px;
    }
    a {
      color: var(--accent);
      font-weight: bold;
    }
    img {
      max-width: 250px;
      height: auto;
      margin: 20px auto;
      display: block;
      border: 4px solid var(--text-main);
      border-radius: 8px;
    }
    .pink-highlight-text {
        color: var(--pink-highlight); 
        font-weight: bold;
        font-size: 17px; 
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 8px;
      }
      .container {
        padding: 18px 10px;
        margin-top: 20px;
      }
      .fkz {
        font-size: 30px;
      }
    }

    /* フェードインアニメーションの定義 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="fkz">Time Regulus</h1>
    <p class="subtitle">お知らせ</p>
    
    <p style="font-weight: bold; font-size: 18px; margin-top: 20px;">
        …こちらの旧アプリをお使いの方は、下記のQRコードから新しいTime Regulusを開いてください。…
    </p>

    <h2>最新バージョンはこちらから</h2>
    <p>下記のQRコードをスキャンして開いてください。</p>

    <img src="QRCorde-z.PNG" alt="新しいTime RegulusのQRコード">

    <p style="margin-top: 30px;">
        Time Regulusは、皆様からいただいたご意見を基に、ＵＩ等を改良しています。
    </p>

    <p class="pink-highlight-text">
        ジャンプ先のページからホーム画面に追加、若しくはダウンロードして、電波が届かないところでも使えるアプリとしてご活用ください。
    </p>
  </div>

  <script src="register-sw.js"></script> 
</body>
</html>
